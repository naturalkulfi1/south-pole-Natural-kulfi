<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Loyalty - South Pole Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">
    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-center">
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-amber-200 space-y-4 text-center">
            <h1 class="text-xl font-extrabold text-amber-900">🎁 लॉयल्टी पॉईंट्स तपासा</h1>
            <form method="POST" class="space-y-3">
                <input type="tel" name="phone" placeholder="10 अंकी मोबाईल नंबर" required class="w-full p-3 border rounded-lg text-sm outline-none">
                <button type="submit" class="w-full bg-amber-600 text-white font-bold py-2.5 rounded-lg shadow text-sm">पॉईंट्स बघा</button>
            </form>
            {% if phone %}
            <div class="bg-amber-50 p-3 rounded-lg border text-xs">
                <p class="text-gray-500">नंबर: {{ phone }}</p>
                <p class="text-lg font-bold text-amber-900 mt-1">पॉईंट्स: {{ points }} ⭐</p>
            </div>
            {% endif %}
            <a href="/order" class="block text-amber-700 text-xs font-semibold hover:underline mt-2">← मुख्य मेनू कडे जा</a>
        </div>
    </div>
</body>
</html>
