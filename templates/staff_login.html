<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - South Pole</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; margin: 0; padding: 15px; }
        .box { background: white; max-width: 350px; margin: 50px auto; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #004d40; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #004d40; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .error { color: red; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>👨‍🍳 स्टाफ लॉगिन</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="युजरनेम" required>
            <input type="password" name="password" placeholder="पासवर्ड" required>
            <button type="submit">लॉगिन करा</button>
        </form>
        <p style="text-align: center; margin-top: 10px;"><a href="/" style="font-size: 12px; color: #004d40;">⬅️ होम पेजवर जा</a></p>
    </div>
</body>
</html>
