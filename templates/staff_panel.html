<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Panel</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; margin: 0; padding: 10px; }
        .card { background: white; padding: 12px; border-radius: 6px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { border: 1px solid #ddd; padding: 5px; text-align: left; }
        th { background: #004d40; color: white; }
    </style>
</head>
<body>
    <div style="background: #004d40; color: white; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin:0; font-size: 15px;">👨‍🍳 स्टाफ डॅशबोर्ड (ऑर्डर्स)</h2>
        <a href="/staff/logout" style="color:white; font-size:12px; text-decoration:none;">लॉग आउट</a>
    </div>

    <div class="card">
        <h3>प्राप्त झालेल्या ऑर्डर्स</h3>
        <table>
            <tr><th>ID</th><th>नाव</th><th>एकूण</th><th>स्थिती</th><th>कृती</th></tr>
            {% for o in orders %}
            <tr>
                <td>#{{ o.id }}</td>
                <td>{{ o.name }}</td>
                <td>₹{{ o.total }}</td>
                <td>{{ o.status }}</td>
                <td>
                    {% if o.status == 'Pending' %}
                    <a href="/staff/confirm/{{ o.id }}" style="background:#27ae60; color:white; padding:3px 6px; border-radius:3px; text-decoration:none;">कन्फर्म करा</a>
                    {% else %}
                    <b>पूर्ण झाली</b>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <div style="text-align: center; margin-top: 10px;">
        <a href="/" style="font-size: 12px; color: #004d40; font-weight: bold; text-decoration: none;">⚡ मुख्य POS पेजवर जा</a>
    </div>
</body>
</html>
