<!DOCTYPE html>
<html lang="mr">
<head><meta charset="UTF-8"><title>Staff Panel</title></head>
<body style="font-family:sans-serif; background:#eef2f3; padding:10px;">
    <div style="background:#004d40; color:white; padding:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; font-size:15px;">👨‍🍳 स्टाफ डॅशबोर्ड (ऑर्डर लिस्ट)</h2>
        <a href="/staff/logout" style="color:white; font-size:12px; text-decoration:none;">लॉग आउट</a>
    </div>
    <div style="background:white; padding:10px; border-radius:6px; margin-top:10px;">
        <h3>सध्याच्या ऑर्डर</h3>
        <table style="width:100%; border-collapse:collapse; font-size:11px;">
            <tr><th>ID</th><th>नाव</th><th>एकूण ₹</th><th>स्टेटस</th><th>कृती</th></tr>
            {% for o in orders %}
            <tr>
                <td>#{{ o.id }}</td>
                <td>{{ o.name }}</td>
                <td>₹{{ o.total }}</td>
                <td>{{ o.status }}</td>
                <td>
                    {% if o.status == 'Pending' %}
                    <a href="/staff/confirm/{{ o.id }}" style="background:green; color:white; padding:3px 6px; text-decoration:none; border-radius:3px;">कन्फर्म करा</a>
                    {% else %}
                    पूर्ण झाली
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
        <p style="margin-top:10px;"><a href="/" style="font-size:12px; color:#004d40; text-decoration:none; font-weight:bold;">← मुख्य POS पेज</a></p>
    </div>
</body>
</html>
