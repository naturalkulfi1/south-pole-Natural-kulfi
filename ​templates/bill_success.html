<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - South Pole Natural Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">
    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-center">
        <div class="bg-white p-6 rounded-2xl shadow-xl text-center border border-amber-200 space-y-4">
            <div class="text-5xl">🎉</div>
            <h1 class="text-2xl font-extrabold text-amber-900">ऑर्डर यशस्वी झाली!</h1>
            <p class="text-gray-600 text-sm">तुमची कुल्फी तयार होत आहे.</p>
            
            <div class="bg-amber-50 p-4 rounded-xl text-left space-y-2 border border-amber-100">
                <div class="flex justify-between text-sm"><span class="text-gray-600">ग्राहकाचे नाव:</span><span class="font-bold text-gray-800">{{ order.name }}</span></div>
                <div class="flex justify-between text-sm"><span class="text-gray-600">मोबाईल नंबर:</span><span class="font-bold text-gray-800">{{ order.phone }}</span></div>
                <div class="flex justify-between text-sm"><span class="text-gray-600">कुल्फी:</span><span class="font-bold text-gray-800">{{ order.item_name }}</span></div>
                <div class="flex justify-between text-sm border-t pt-2"><span class="text-gray-600 font-bold">एकूण रक्कम:</span><span class="font-bold text-amber-700">₹{{ order.price }}</span></div>
            </div>

            <div class="bg-amber-100 p-3 rounded-xl text-amber-900 font-semibold text-sm">
                ⭐ एकूण लॉयल्टी पॉईंट्स: {{ order.points }}
            </div>

            <a href="/order" class="block w-full bg-amber-600 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-700 transition text-center">
                पुन्हा ऑर्डर करा 🍦
            </a>
        </div>
    </div>
</body>
</html>
