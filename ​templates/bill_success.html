<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑर्डर यशस्वी</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">
    <div class="max-w-md mx-auto p-4 text-center mt-10">
        <div class="bg-white p-6 rounded-2xl shadow-xl space-y-4">
            <div class="text-5xl">✅</div>
            <h1 class="text-2xl font-extrabold text-amber-900">ऑर्डर यशस्वीरित्या नोंदवली!</h1>
            <p class="text-gray-600">धन्यवाद, <strong>{{ bill.customer_name }}</strong>!</p>
            <div class="bg-amber-50 p-4 rounded-xl text-left space-y-1">
                <p><strong>कुल्फी:</strong> {{ bill.items_summary }}</p>
                <p><strong>एकूण रक्कम:</strong> ₹{{ bill.total_amount }}</p>
                <p><strong>स्टेटस:</strong> {{ bill.status }}</p>
            </div>
            <a href="{{ whatsapp_url }}" target="_blank" class="block w-full bg-green-600 text-white font-bold p-3 rounded-xl shadow-lg hover:bg-green-700 transition">
                💬 दुकानदाराला WhatsApp वर पाठवा
            </a>
            <a href="/order" class="block text-amber-700 font-semibold underline pt-2">नवीन ऑर्डर द्या</a>
        </div>
    </div>
</body>
</html>
