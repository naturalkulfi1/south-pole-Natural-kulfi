<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Pole Natural Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 pb-28">
    <div class="max-w-md mx-auto p-4">
        <div class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-amber-900">❄️ South Pole Natural Kulfi</h1>
            <p class="text-gray-600 mt-1">स्कॅन करा, कुल्फी निवडा आणि लॉयल्टी पॉईंट्स मिळवा!</p>
        </div>

        <div class="mb-6 bg-white p-4 rounded-xl shadow-md text-center border border-amber-200">
            <a href="/check-loyalty" class="text-amber-700 font-semibold hover:underline">🎁 तुमचे लॉयल्टी पॉईंट्स तपासा? इथे क्लिक करा</a>
        </div>

        <form method="POST" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-md space-y-3 border border-amber-200">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2">१. तुमची माहिती भरा</h2>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">पूर्ण नाव</label>
                    <input type="text" name="name" placeholder="उदा. राहुल पाटील" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">मोबाईल नंबर</label>
                    <input type="tel" name="phone" placeholder="10 अंकी मोबाईल नंबर" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">जन्मतारीख</label>
                    <input type="date" name="dob" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <h2 class="text-xl font-bold text-amber-900 mt-6">आमच्या स्पेशल कुल्फी</h2>
            <div class="grid grid-cols-1 gap-3">
                {% for item in items %}
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 border border-amber-100 flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-lg text-gray-800">{{ item.name }}</h3>
                        <p class="text-amber-600 font-bold">₹{{ item.price }}</p>
                    </div>
                    <div>
                        <label class="cursor-pointer bg-amber-50 border border-amber-300 px-4 py-2 rounded-lg text-amber-800 font-semibold hover:bg-amber-100 transition inline-block">
                            <input type="radio" name="item_id" value="{{ item.id }}" required class="mr-1 accent-amber-600"> निवडा
                        </label>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-amber-200 p-4 shadow-lg max-w-md mx-auto z-50">
                <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:bg-amber-700 transition flex items-center justify-center space-x-2 text-lg">
                    <span>ऑर्डर कन्फर्म करा & बिल बनवा</span>
                    <span>🚀</span>
                </button>
            </div>
        </form>
    </div>
</body>
</html>
