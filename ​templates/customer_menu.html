<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Pole Natural Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">
    <div class="max-w-md mx-auto p-4">
        <div class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-amber-900">❄️ South Pole Natural Kulfi</h1>
            <p class="text-gray-600">स्कॅन करा, कुल्फी निवडा आणि लॉयल्टी पॉईंट्स मिळवा!</p>
        </div>

        <div class="mb-6 bg-white p-4 rounded-xl shadow-md text-center">
            <a href="/check-loyalty" class="text-amber-700 font-semibold underline">तुमचे लॉयल्टी पॉईंट्स तपासा? इथे क्लिक करा</a>
        </div>

        <form method="POST" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-md space-y-3">
                <h2 class="text-lg font-bold text-gray-800">१. तुमची माहिती भरा</h2>
                <input type="text" name="name" placeholder="पूर्ण नाव (Full Name)" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500">
                <input type="text" name="phone" placeholder="मोबाईल नंबर (Phone Number)" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500">
                <input type="date" name="dob" placeholder="जन्मतारीख (DOB)" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>

            <h2 class="text-xl font-bold text-amber-900 mt-6">आमच्या स्पेशल कुल्फी</h2>
            <div class="grid grid-cols-1 gap-4">
                {% for item in items %}
                <div class="bg-white rounded-xl shadow-md overflow-hidden flex items-center p-3 border border-amber-100">
                    <div class="flex-grow">
                        <h3 class="font-bold text-lg text-gray-800">{{ item.name }}</h3>
                        <p class="text-amber-600 font-bold">₹{{ item.price }}</p>
                    </div>
                    <div>
                        <input type="radio" name="item_id" value="{{ item.id }}" required class="w-5 h-5 text-amber-600">
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-amber-600 text-white font-bold p-4 rounded-xl shadow-lg hover:bg-amber-700 transition mt-6">
                ऑर्डर कन्फर्म करा & बिल बनवा 🚀
            </button>
        </form>
    </div>
</body>
</html>
