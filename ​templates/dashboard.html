<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - South Pole Natural Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 p-4">
    <div class="max-w-xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow border border-amber-200">
            <h1 class="text-xl font-extrabold text-amber-900">📊 ॲडमिन डॅशबोर्ड</h1>
            <a href="/order" class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-amber-200">मेनू</a>
        </div>

        <div class="bg-white rounded-xl shadow border border-amber-200 overflow-hidden">
            <div class="p-4 border-b bg-amber-50 font-bold text-gray-800">सर्व ऑर्डरची यादी</div>
            <div class="divide-y">
                {% if orders %}
                    {% for order in orders %}
                    <div class="p-4 space-y-1">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>{{ order.name }}</span>
                            <span class="text-amber-600">₹{{ order.price }}</span>
                        </div>
                        <div class="text-xs text-gray-500 flex justify-between">
                            <span>📞 {{ order.phone }}</span>
                            <span>🍦 {{ order.item_name }}</span>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="p-6 text-center text-gray-500 text-sm">कोणतीही ऑर्डर नाही.</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
