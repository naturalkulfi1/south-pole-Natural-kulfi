<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - South Pole Natural Kulfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">
    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-center">
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-amber-200 space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-extrabold text-amber-900">🔐 ॲडमिन लॉगिन</h1>
                <p class="text-gray-600 text-sm mt-1">डॅशबोर्ड पाहण्यासाठी लॉग इन करा</p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">युजरनेम</label>
                    <input type="text" name="username" placeholder="Username" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">पासवर्ड</label>
                    <input type="password" name="password" placeholder="Password" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-700 transition">
                    लॉगिन करा 🚀
                </button>
            </form>

            <div class="text-center">
                <a href="/order" class="text-amber-700 font-semibold text-sm hover:underline">← मुख्य मेनू कडे जा</a>
            </div>
        </div>
    </div>
</body>
</html>
